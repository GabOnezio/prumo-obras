name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write       # assinatura/atestado keyless
  attestations: write   # proveniência do build
  packages: write

jobs:
  build:
    # Matriz: servidor Linux, desktop Windows/Linux, Android.
    # TODO(Fase 6): este workflow nunca rodou. No Linux, o crate do desktop precisa das
    # bibliotecas do WebKitGTK antes do `cargo build --workspace`.
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4  # TODO: fixar por SHA
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --workspace
      # TODO(Fase 6): cargo tauri build (desktop), cargo tauri android build (APK/AAB assinados)
      #   - Windows: assinar MSI/EXE com certificado de assinatura de código (segredo do repositório)
      #   - Android: keystore de release em segredo; nunca publicar APK de debug
      - name: Reunir artefatos
        shell: bash
        run: |
          mkdir -p dist
          cp -r target/release/prumo-* dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist

  publicar:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SBOM (CycloneDX)
        run: |
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --format json --all
      - name: Somas de verificação
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Atestado de proveniência
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Assinar SHA256SUMS (Sigstore)
        uses: sigstore/cosign-installer@v3
      - run: cosign sign-blob --yes dist/SHA256SUMS --output-signature dist/SHA256SUMS.sig --output-certificate dist/SHA256SUMS.pem
      - name: Criar release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            **/bom.json
            CHANGELOG.md
          generate_release_notes: false
          body_path: CHANGELOG.md
