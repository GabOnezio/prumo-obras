name: CI

# Os mesmos passos de scripts/ci-local.sh --tudo. Enquanto o GitHub Actions não iniciar nos
# repositórios privados desta conta, o porteiro é o script local (docs/adr/0010).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: descartavel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # scripts/db-test.sh cria e apaga os bancos prumo_teste_* e o papel app_rw neste servidor.
      PRUMO_PG_URL: postgres://postgres:descartavel@localhost:5432
      PRUMO_PG_DESCARTAVEL: "1"
    steps:
      - uses: actions/checkout@v4  # TODO: fixar por SHA completo antes da primeira release
      - name: Bibliotecas do Tauri (WebKitGTK) e cliente do PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            build-essential pkg-config postgresql-client
      # A versão do Rust e os componentes vêm de rust-toolchain.toml.
      - name: Toolchain fixada
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Banco em PostgreSQL 16 real (porte, migrações, paridade Rust × SQL e sabotagem)
        run: ./scripts/db-test.sh
      - name: Avisos de segurança e licenças das dependências
        run: |
          cargo install --locked cargo-deny cargo-audit
          cargo audit
          cargo deny check

  ui:
    # Os passos só rodam quando a pasta ui/ existir. A condição fica em cada passo
    # porque hashFiles() não é aceita na condição do job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: ${{ hashFiles('ui/package.json') != '' }}
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('ui/package.json') != '' }}
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
        if: ${{ hashFiles('ui/package.json') != '' }}
      - run: pnpm -C ui lint
        if: ${{ hashFiles('ui/package.json') != '' }}
      - run: pnpm -C ui test
        if: ${{ hashFiles('ui/package.json') != '' }}

  segredos-e-dados:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bloquear arquivos que não podem ir ao repositório
        run: |
          if git ls-files | grep -E '\.(apk|aab|keystore|jks|pfx|p12|pem|dump|bak)$'; then
            echo "Arquivo proibido no repositório"; exit 1
          fi
