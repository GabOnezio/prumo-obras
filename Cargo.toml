[workspace]
resolver = "2"
members = [
    "crates/dominio",
    "crates/demonstracao",
    "crates/paridade",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
strip = true
